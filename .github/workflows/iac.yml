name: IaC

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "infra/ansible/**"
      - ".github/workflows/iac.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/ansible/**"
      - ".github/workflows/iac.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [oci-lab, aws-lab, azure-lab]
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Check formatting
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Init (no backend, no apply)
        run: terraform init -backend=false -input=false -no-color

      - name: Validate
        run: terraform validate -no-color

  ansible:
    name: Ansible lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core and ansible-lint
        run: pip install "ansible-core>=2.17" "ansible-lint>=24.0"

      - name: Lint
        working-directory: infra/ansible
        run: ansible-lint

      - name: Syntax check
        working-directory: infra/ansible
        run: ansible-playbook --syntax-check -i inventory/hosts.example.ini playbooks/cluster-addons.yml
