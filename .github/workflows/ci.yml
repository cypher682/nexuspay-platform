name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run every job regardless of changed paths"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/nexuspay

permissions:
  contents: read
  actions: read

jobs:
  # ──────────────────────────────────────────────
  # Detect which services changed (emits JSON list
  # of changed services for downstream matrices)
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.json }}
      infra: ${{ steps.services.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ github.event.inputs.force_all != 'true' }}
        with:
          base: ${{ github.event_name == 'workflow_dispatch' && 'HEAD~1' || github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'workflow_dispatch' && 'HEAD' || github.event.pull_request.head.sha || github.sha }}
          filters: |
            gateway:
              - 'services/api-gateway/**'
              - 'docs/openapi.yaml'
            auth:
              - 'services/auth-service/**'
            payments:
              - 'services/payments-service/**'
            notifications:
              - 'services/notifications-service/**'
            infra:
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/**'
              - 'k6/**'
              - 'scripts/**'
              - 'infra/monitoring/**'

      - name: Build JSON matrix of changed services
        id: services
        env:
          GATEWAY: ${{ steps.filter.outputs.gateway }}
          AUTH: ${{ steps.filter.outputs.auth }}
          PAYMENTS: ${{ steps.filter.outputs.payments }}
          NOTIFICATIONS: ${{ steps.filter.outputs.notifications }}
          INFRA: ${{ steps.filter.outputs.infra }}
          FORCE_ALL: ${{ github.event.inputs.force_all }}
        run: |
          if [ "$FORCE_ALL" = "true" ]; then
            JSON='[{"service":"api-gateway"},{"service":"auth-service"},{"service":"payments-service"},{"service":"notifications-service"}]'
            INFRA_JSON=true
          else
            JSON="[]"
            add() {
              JSON=$(node -e '
                const list = JSON.parse(process.argv[1]);
                list.push({ service: process.argv[2] });
                console.log(JSON.stringify(list));
              ' "$JSON" "$1")
            }
            [ "$GATEWAY" = "true" ] && add api-gateway
            [ "$AUTH" = "true" ] && add auth-service
            [ "$PAYMENTS" = "true" ] && add payments-service
            [ "$NOTIFICATIONS" = "true" ] && add notifications-service
            INFRA_JSON=$INFRA
          fi
          echo "json=$JSON" >> "$GITHUB_OUTPUT"
          echo "infra=$INFRA_JSON" >> "$GITHUB_OUTPUT"
          echo "Changed services: $JSON"

  # ──────────────────────────────────────────────
  # Lint + Typecheck (all services, always runs)
  # ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            services/api-gateway/package-lock.json
            services/auth-service/package-lock.json
            services/payments-service/package-lock.json
            services/notifications-service/package-lock.json

      - name: Install dependencies and lint/typecheck each service
        run: |
          for svc in api-gateway auth-service payments-service notifications-service; do
            echo "::group::$svc"
            cd services/$svc
            npm ci --no-audit --no-fund
            npm run lint
            npx tsc --noEmit
            cd ../..
            echo "::endgroup::"
          done

      - name: Validate Prometheus + Alertmanager config
        run: |
          docker run --rm -v "${{ github.workspace }}/infra/monitoring/prometheus/rules:/rules:ro" \
            prom/prometheus:v3.14.0 promtool check rules /rules/*.yml
          docker run --rm -v "${{ github.workspace }}/infra/monitoring/alertmanager:/am:ro" \
            prom/alertmanager:v0.28.0 amtool check-config /am/alertmanager.yml
          docker run --rm -v "${{ github.workspace }}/infra/monitoring/prometheus:/prom:ro" \
            prom/prometheus:v3.14.0 promtool check config /prom/prometheus.yml

  # ──────────────────────────────────────────────
  # Unit tests (only changed services)
  # ──────────────────────────────────────────────
  test:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          npm ci --no-audit --no-fund
          npm test -- --coverage --coverageReporters=text-summary

  # ──────────────────────────────────────────────
  # Docker build + push to GHCR (push only, changed)
  # ──────────────────────────────────────────────
  build:
    needs: [changes, test]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && needs.changes.outputs.services != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up BuildKit (docker-container driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true
          format: table

  # ──────────────────────────────────────────────
  # Dependency audit + supply chain scan
  # ──────────────────────────────────────────────
  audit:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - name: npm audit (all services)
        run: |
          FAILED=0
          for svc in api-gateway auth-service payments-service notifications-service; do
            echo "::group::$svc audit"
            cd services/$svc
            if [ -f package-lock.json ]; then npm ci --ignore-scripts 2>/dev/null; fi
            npm audit --audit-level=high || FAILED=1
            cd ../..
            echo "::endgroup::"
          done
          exit $FAILED

  # ──────────────────────────────────────────────
  # OpenAPI validation
  # ──────────────────────────────────────────────
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies (tsx, yaml)
        run: npm ci

      - name: Validate OpenAPI spec against code
        run: npx tsx scripts/validate-openapi.ts

      - name: Spectral lint
        uses: stoplightio/spectral-action@latest
        with:
          file_glob: docs/openapi.yaml
          spectral_ruleset: .spectral.yaml

  # ──────────────────────────────────────────────
  # k6 smoke test (lightweight CI validation)
  # ──────────────────────────────────────────────
  k6-smoke:
    needs: [lint, changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.services != '[]' || needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env from example
        run: cp .env.example .env

      - name: Start full stack via Docker Compose
        run: docker compose up -d --wait

      - name: Apply Prisma migrations
        run: |
          for svc in auth-service payments-service notifications-service; do
            echo "::group::migrate $svc"
            cd services/$svc
            npm ci --no-audit --no-fund
            DATABASE_URL="postgresql://nexuspay:nexuspay@localhost:5433/nexuspay_${svc%-service}?schema=public" \
              npx prisma migrate deploy
            cd ../..
            echo "::endgroup::"
          done

      - name: Run k6 smoke test
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/k6:/scripts" \
            grafana/k6:0.49.0 run /scripts/smoke-test.js

      - name: Tear down
        if: always()
        run: docker compose down -v
