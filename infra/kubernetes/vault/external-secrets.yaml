# Phase 3.4 - External Secrets Operator (ESO) scaffold.
#
# ESO syncs secrets from Vault into native Kubernetes Secrets so the service
# charts (secretKeyRef) keep working without storing plaintext material in
# git. This file installs the operator itself.
#
# Install (standard, pinned):
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm upgrade --install external-secrets external-secrets/external-secrets \
#     --namespace external-secrets --create-namespace \
#     --version 0.10.0 --set installCRDs=true
#
# Then apply secret-store + external-secrets (see vault-secrets.yaml).
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      # In-cluster Vault dev server (see vault-dev.yaml). For the compose dev
      # server running on the host, replace this with the host's reachable
      # address (e.g. http://host.docker.internal:18200) in dev.
      server: http://vault.nexuspay-data.svc.cluster.local:8200
      path: secret/data/nexuspay
      # Read-only token scoped to the kv-v2 secret path (see vault-dev.yaml
      # role). Never store root tokens in a SecretStore in production.
      auth:
        token:
          # Reference a K8s Secret holding the Vault token; see vault-dev.yaml.
          secretRef:
            name: vault-token
            namespace: nexuspay-dev
            key: token
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: nexuspay-dev
spec:
  provider:
    vault:
      server: http://vault.nexuspay-data.svc.cluster.local:8200
      path: secret/data/nexuspay
      auth:
        token:
          secretRef:
            name: vault-token
            key: token