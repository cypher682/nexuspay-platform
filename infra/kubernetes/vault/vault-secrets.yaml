# Phase 3.4 - ExternalSecret resources.
#
# These mirror the secrets that bootstrap-secrets.sh currently creates by hand
# (nexuspay-shared, auth-db, payments-db, notifications-db, rabbitmq-url).
# Once ESO + the SecretStore are installed, delete the manual secrets and ESO
# will own them - charts keep working via the same secretKeyRef lookups.
#
# Vault KV store layout (kv-v2 at secret/data/nexuspay/...):
#   nexuspay-shared/jwt-secret, internal-api-key, provider-webhook-secret
#   <svc>-db/url           (postgresql://...)
#   rabbitmq-url/url       (amqp://...)
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexuspay-shared
  namespace: nexuspay-dev
spec:
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: nexuspay-shared
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: nexuspay-shared
        property: jwt-secret
    - secretKey: internal-api-key
      remoteRef:
        key: nexuspay-shared
        property: internal-api-key
    - secretKey: provider-webhook-secret
      remoteRef:
        key: nexuspay-shared
        property: provider-webhook-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-db
  namespace: nexuspay-dev
spec:
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: auth-db
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: auth-db
        property: url
---
