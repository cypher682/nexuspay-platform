image:
  repository: ghcr.io/cypher682/nexuspay-notifications-service
  digest: sha256:3a7f0c1ba7457f79585adcf06ef38ea2625c982efd9cf45d9516d095804f035b
  pullPolicy: IfNotPresent

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6

podDisruptionBudget:
  enabled: true

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Real SMTP endpoint in prod is injected by CI as a patch on env[SMTP_URL]
# (secretKeyRef -> notifications-smtp/url); mock senders stay in dev only.
