fullnameOverride: reporting-service

replicaCount: 2
terminationGracePeriodSeconds: 20

image:
  repository: nexuspay/reporting-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4006

env:
  - name: LOG_LEVEL
    value: info
  - name: SNAPSHOT_DAYS
    value: "7"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: reporting-db
        key: url
  - name: PAYMENTS_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: payments-db
        key: url
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: nexuspay-shared
        key: jwt-secret
        optional: false
  - name: OLD_JWT_SECRETS
    valueFrom:
      secretKeyRef:
        name: nexuspay-shared
        key: old-jwt-secrets
        optional: true
  - name: INTERNAL_API_KEY
    valueFrom:
      secretKeyRef:
        name: nexuspay-shared
        key: internal-api-key
        optional: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true
  mode: gateway-only

serviceMonitor:
  enabled: true
  interval: 30s

migrations:
  enabled: true
  command: ["npx", "--no-install", "prisma", "migrate", "deploy"]
  databaseSecret: reporting-db
  databaseSecretKey: url

cronjob:
  enabled: true
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi
