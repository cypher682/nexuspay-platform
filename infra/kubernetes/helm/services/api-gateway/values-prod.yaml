# Prod overlay (single-node k3s): arm64 images published to GHCR by the
# "Publish" workflow. tag:latest + Always keeps restarts pulling the newest
# build; pin by digest later when enabling the Gatekeeper digest constraint.
image:
  repository: ghcr.io/cypher682/nexuspay-api-gateway
  digest: sha256:87e71b4005db45566196e92da6d6c03303b54a5a013e6c1f63c3ba938d1eef77
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: nexuspay.141-148-69-94.sslip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - nexuspay.141-148-69-94.sslip.io
      secretName: nexuspay-tls

replicaCount: 3

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  minReplicas: 3
  maxReplicas: 10
