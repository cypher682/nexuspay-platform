fullnameOverride: auth-service

replicaCount: 2
terminationGracePeriodSeconds: 25

image:
  repository: nexuspay/auth-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4001

env:
  - name: LOG_LEVEL
    value: info
  - name: REDIS_URL
    value: redis://redis-master.nexuspay-data.svc.cluster.local:6379
  - name: RABBITMQ_URL
    valueFrom:
      secretKeyRef:
        name: rabbitmq-url
        key: url
  - name: PUBLIC_BASE_URL
    value: https://nexuspay.141-148-69-94.sslip.io
  - name: MFA_ISSUER
    value: NexusPay
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: auth-db
        key: url
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: nexuspay-shared
        key: jwt-secret
        optional: false
  - name: OLD_JWT_SECRETS
    valueFrom:
      secretKeyRef:
        name: nexuspay-shared
        key: old-jwt-secrets
        optional: true

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true
  mode: gateway-only

serviceMonitor:
  enabled: true
  interval: 30s

migrations:
  enabled: true
  command: ["npx", "--no-install", "prisma", "migrate", "deploy"]
  databaseSecret: auth-db
  databaseSecretKey: url
