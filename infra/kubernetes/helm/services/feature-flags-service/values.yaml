fullnameOverride: feature-flags-service

replicaCount: 2
terminationGracePeriodSeconds: 20

image:
  repository: nexuspay/feature-flags-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4004

env:
  - name: LOG_LEVEL
    value: info
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: feature-flags-db
        key: url
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: nexuspay-shared
        key: jwt-secret
        optional: false
  - name: OLD_JWT_SECRETS
    valueFrom:
      secretKeyRef:
        name: nexuspay-shared
        key: old-jwt-secrets
        optional: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true
  mode: gateway-only

serviceMonitor:
  enabled: true
  interval: 30s

migrations:
  enabled: true
  command: ["npx", "--no-install", "prisma", "migrate", "deploy"]
  databaseSecret: feature-flags-db
  databaseSecretKey: url
