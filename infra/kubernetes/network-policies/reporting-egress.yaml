# Reporting reads payment aggregates from the payments database and writes
# snapshots to its own database. Both live on the same Postgres server, so the
# only egress is TCP 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reporting-egress
  namespace: nexuspay-prod
  labels:
    app.kubernetes.io/part-of: nexuspay
    policy-type: egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reporting-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nexuspay-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
