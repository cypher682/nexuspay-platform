# fraud-service egress: postgres (rules + decisions) and redis (velocity counters).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-egress
  namespace: nexuspay-prod
  labels:
    app.kubernetes.io/part-of: nexuspay
    policy-type: egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fraud-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nexuspay-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nexuspay-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
