  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nexuspay-dev
          podSelector:
            matchLabels:
              app.kubernetes.io/name: payments-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nexuspay-dev
          podSelector:
            matchLabels:
              app.kubernetes.io/name: notifications-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nexuspay-prod
          podSelector:
            matchLabels:
              app.kubernetes.io/name: payments-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nexuspay-prod
          podSelector:
            matchLabels:
