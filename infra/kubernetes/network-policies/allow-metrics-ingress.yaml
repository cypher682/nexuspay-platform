# Prometheus scrapes the NexusPay pods directly from the monitoring namespace.
# The app pods' own Helm policies restrict ingress to the gateway, and deny-all
# blocks everything else, so this is the explicit exception.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-ingress
  namespace: nexuspay-prod
  labels:
    app.kubernetes.io/part-of: nexuspay
    policy-type: ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: nexuspay
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4000
        - protocol: TCP
          port: 4001
        - protocol: TCP
          port: 4002
        - protocol: TCP
          port: 4003
