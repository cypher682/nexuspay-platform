apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nexuspay
  namespace: argocd
spec:
  description: NexusPay fintech platform (gateway + auth + payments + notifications)
  sourceRepos:
    - https://github.com/cypher682/nexuspay-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: nexuspay-dev
    - server: https://kubernetes.default.svc
      namespace: nexuspay-prod
    - server: https://kubernetes.default.svc
      namespace: nexuspay-data
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    # Guardrails are cluster-scoped; Gatekeeper itself stays an imperative
    # cluster add-on, but its templates/constraints are reconciled from git.
    - group: templates.gatekeeper.sh
      kind: ConstraintTemplate
    - group: constraints.gatekeeper.sh
      kind: K8sRequireImageDigest
    - group: constraints.gatekeeper.sh
      kind: K8sAllowedRepos
    - group: constraints.gatekeeper.sh
      kind: K8sRequiredResources
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
  roles:
    - name: deployer
      policies:
        - p, proj:nexuspay:deployer, applications, get, nexuspay/*, allow
        - p, proj:nexuspay:deployer, applications, sync, nexuspay/*, allow
