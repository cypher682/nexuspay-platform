apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: k8srequiredresources
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredResources
      validation:
        openAPIV3Schema:
          type: object
          properties:
            requiredFields:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredresources

        # Workloads put containers under spec.template.spec; Pods use spec.
        containers[c] { c := input.review.object.spec.template.spec.containers[_] }
        containers[c] { c := input.review.object.spec.template.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }

        violation[{"msg": msg}] {
          container := containers[_]
          fields := {f | f := input.parameters.requiredFields[_]}
          missing := {f | f := fields[_]; not container.resources[f]}
          count(missing) > 0
          msg := sprintf("container <%v> is missing resource fields: %v", [container.name, missing])
        }
