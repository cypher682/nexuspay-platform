apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: k8sallowedrepos
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRepos
      validation:
        openAPIV3Schema:
          type: object
          properties:
            prefixes:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedrepos

        # Workloads put containers under spec.template.spec; Pods use spec.
        containers[c] { c := input.review.object.spec.template.spec.containers[_] }
        containers[c] { c := input.review.object.spec.template.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }

        violation[{"msg": msg}] {
          container := containers[_]
          allowed := {p | p := input.parameters.prefixes[_]}
          not startswith_any(container.image, allowed)
          msg := sprintf("container <%v> image <%v> is not from an approved registry prefix", [container.name, container.image])
        }

        startswith_any(image, prefixes) {
          startswith(image, prefixes[_])
        }
