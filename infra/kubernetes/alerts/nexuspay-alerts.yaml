apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nexuspay-alerts
  namespace: nexuspay-prod
  labels:
    app.kubernetes.io/part-of: nexuspay
    prometheus: kube-prometheus
spec:
  groups:
    - name: nexuspay-sli-recording-rules
      interval: 30s
      rules:
        - record: nexuspay:http_error_ratio:rate5m
          expr: |
            sum by (service) (rate(http_requests_total{status_class=~"5[0-9][0-9]"}[5m]))
              / clamp_min(sum by (service) (rate(http_requests_total[5m])), 1e-9)
        - record: nexuspay:http_error_ratio:rate1h
          expr: |
            sum by (service) (rate(http_requests_total{status_class=~"5[0-9][0-9]"}[1h]))
              / clamp_min(sum by (service) (rate(http_requests_total[1h])), 1e-9)
        - record: nexuspay:http_request_duration_seconds:p99:rate5m
          expr: |
            histogram_quantile(0.99,
              sum by (le, service) (rate(http_request_duration_seconds_bucket[5m])))
        - record: nexuspay:slo:burn_rate:5m
          labels:
            slo: "99.5%"
            budget: "30d"
          expr: |
            clamp_min(nexuspay:http_error_ratio:rate5m / 0.005, 0)
        - record: nexuspay:slo:burn_rate:1h
          labels:
            slo: "99.5%"
            budget: "30d"
          expr: |
            clamp_min(nexuspay:http_error_ratio:rate1h / 0.005, 0)

    - name: nexuspay-alerting-rules
      interval: 30s
      rules:
        - alert: NexusPayHighErrorRate
          expr: nexuspay:http_error_ratio:rate5m > 0.01
          for: 2m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "{{ $labels.service }} error rate above 1%"
            description: "{{ $labels.service }} returned 5xx for {{ $value | humanizePercentage }} of requests over the last 5 minutes (SLO target 99.5%)."
        - alert: NexusPayHighP99Latency
          expr: nexuspay:http_request_duration_seconds:p99:rate5m > 2.0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "{{ $labels.service }} p99 latency above 2s"
            description: "p99 latency for {{ $labels.service }} is {{ $value | humanizeDuration }} - breaches the 2s latency SLO."
        - alert: NexusPayPaymentsQueueBacklog
          expr: payments_queue_depth{state=~"waiting|active|delayed"} > 100
          for: 2m
          labels:
            severity: page
            team: platform
          annotations:
            summary: "Payments queue backlog above 100 jobs"
            description: "Payments worker backlog (waiting+active+delayed) is {{ $value }}. Consumers may be stalled - check the BullMQ worker and Redis."
        - alert: NexusPaySloCriticalBurn
          expr: nexuspay:slo:burn_rate:1h > 14.4
          for: 5m
          labels:
            severity: page
            team: platform
          annotations:
            summary: "{{ $labels.service }} consuming 30-day error budget at >14.4x"
            description: "At the current 1h error rate, {{ $labels.service }} will exhaust its 99.5% SLO budget in under 2 days (burn rate {{ printf \"%.1f\" $value }}x). Treat as an availability incident."
        - alert: NexusPaySloWarningBurn
          expr: nexuspay:slo:burn_rate:5m > 6
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "{{ $labels.service }} consuming 30-day error budget at >6x"
            description: "{{ $labels.service }} error budget burn rate is {{ printf \"%.1f\" $value }}x - budget will empty in under 5 days if sustained."
        - alert: NexusPayReportingSnapshotStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="nexuspay-prod", cronjob="reporting-service-snapshot"} > 93600
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "No successful reporting snapshot in 26 hours"
            description: "The reporting-service-snapshot CronJob has not completed successfully for over 26 hours. Check job history and the job logs before the daily aggregates go stale."
        - alert: NexusPayReportingSnapshotFailed
          expr: |
            kube_job_failed{namespace="nexuspay-prod", job_name=~"reporting-service-snapshot-.*"} > 0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Reporting snapshot job failed"
            description: "Job {{ $labels.job_name }} has failed. Inspect `kubectl -n nexuspay-prod logs job/{{ $labels.job_name }}`; the previous snapshots remain valid until the next successful run."
        - alert: NexusPayTargetDown
          expr: up{namespace="nexuspay-prod"} == 0
          for: 1m
          labels:
            severity: page
            team: platform
          annotations:
            summary: "{{ $labels.service }} is down"
            description: "Prometheus cannot scrape {{ $labels.instance }} - unreachable for over a minute."

    # Host and workload signals that matter on a single bare-metal node.
    # These use metrics already scraped by kube-prometheus-stack; no new
    # exporters, controllers or workloads are involved.
    - name: nexuspay-bare-metal-signals
      interval: 30s
      rules:
        - alert: NexusPayNodeDiskFilling
          expr: |
            1 - node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.lxcfs"}
              / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.lxcfs"} > 0.85
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Root filesystem is {{ $value | humanizePercentage }} full"
            description: "The single k3s node has less than 15% free on {{ $labels.mountpoint }} ({{ $labels.device }}). Images, container logs and Prometheus TSDB all share this disk; prune images or extend the volume before it reaches 100%."
        - alert: NexusPayNodeMemoryLow
          expr: |
            1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.90
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Node memory usage above 90%"
            description: "Available memory is {{ $value | humanizePercentage }} used. There is no second node to reschedule onto; identify the largest consumer with `kubectl top pods -A` before the kernel starts reclaiming."
        - alert: NexusPayPodRestarting
          expr: |
            sum by (namespace, pod, container) (
              increase(kube_pod_container_status_restarts_total{namespace="nexuspay-prod"}[30m])
            ) > 2
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "{{ $labels.container }} in {{ $labels.pod }} restarted repeatedly"
            description: "The container restarted {{ $value }} times in 30 minutes. Check `kubectl -n {{ $labels.namespace }} describe pod/{{ $labels.pod }}` for the exit code, last state and events."
        - alert: NexusPayReplicasUnavailable
          expr: |
            kube_deployment_status_replicas_available{namespace="nexuspay-prod"}
              < kube_deployment_spec_replicas{namespace="nexuspay-prod"}
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "{{ $labels.deployment }} is below its desired replica count"
            description: "{{ $labels.deployment }} has {{ $value }} unavailable replicas for more than 10 minutes. Check scheduling, probes and image pulls with `kubectl -n {{ $labels.namespace }} get pods -l app.kubernetes.io/name={{ $labels.deployment }}`."
        - alert: NexusPayPvcPending
          expr: |
            kube_persistentvolumeclaim_status_phase{namespace="nexuspay-prod", phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is still Pending"
            description: "The local-path provisioner has not bound this claim for 15 minutes. A pod that needs it will stay Pending; check provisioner logs and free disk on the node."

