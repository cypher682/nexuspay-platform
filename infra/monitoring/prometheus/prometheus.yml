global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Phase 2: SLI/SLO recording rules + alerting rules
#   recording_rules.yml -> availability/latency SLIs, error-budget burn rate
#   alerting_rules.yml  -> error-rate >1%, p99 >2s, queue depth >100, SLO burn
rule_files:
  - /etc/prometheus/rules/*.yml

# Alerting routes to the local Alertmanager, which emails ops@nexuspay.local
# via Mailpit (visible at http://localhost:8025).
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: nexuspay-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:4000
          - auth-service:4001
          - payments-service:4002
          - notifications-service:4003

  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - prometheus:9090