global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nexuspay-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:4000
          - auth-service:4001
          - payments-service:4002
          - notifications-service:4003

  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - prometheus:9090